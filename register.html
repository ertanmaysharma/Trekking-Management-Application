{% extends 'base.html' %}
{% block title %}Register{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4 mt-4">
            <h4 class="mb-3 text-center text-success"><i class="bi bi-person-plus"></i> Register</h4>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Register as</label>
                    <select name="role" class="form-select" id="roleSelect">
                        <option value="user">User (Trekker)</option>
                        <option value="staff">Trek Staff</option>
                    </select>
                </div>
                <div class="mb-3" id="contactField" style="display:none;">
                    <label class="form-label">Contact Number</label>
                    <input type="text" name="contact" class="form-control">
                    <small class="text-muted">Staff accounts require admin approval before login.</small>
                </div>
                <button type="submit" class="btn btn-success w-100">Create Account</button>
            </form>
            <hr>
            <p class="text-center mb-0">Already have an account? <a href="{{ url_for('main.login') }}">Login</a></p>
        </div>
    </div>
</div>

<script>
    const roleSelect = document.getElementById('roleSelect');
    const contactField = document.getElementById('contactField');
    roleSelect.addEventListener('change', function() {
        contactField.style.display = this.value === 'staff' ? 'block' : 'none';
    });
</script>
{% endblock %}
