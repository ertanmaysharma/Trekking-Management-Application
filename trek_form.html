{% extends 'base.html' %}
{% block title %}{% if trek %}Edit Trek{% else %}Create Trek{% endif %}{% endblock %}

{% block content %}
<div class="row justify-content-center">
<div class="col-md-8">
<div class="card p-4">
    <h4 class="mb-3">{% if trek %}<i class="bi bi-pencil"></i> Edit Trek{% else %}<i class="bi bi-plus-circle"></i> Create Trek{% endif %}</h4>
    <form method="POST">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Trek Name <span class="text-danger">*</span></label>
                <input type="text" name="name" class="form-control" value="{{ trek.name if trek else '' }}" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Location <span class="text-danger">*</span></label>
                <input type="text" name="location" class="form-control" value="{{ trek.location if trek else '' }}" required>
            </div>
        </div>
        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label">Difficulty <span class="text-danger">*</span></label>
                <select name="difficulty" class="form-select" required>
                    {% for d in ['Easy', 'Moderate', 'Hard'] %}
                        <option value="{{ d }}" {% if trek and trek.difficulty == d %}selected{% endif %}>{{ d }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Duration (days) <span class="text-danger">*</span></label>
                <input type="number" name="duration" class="form-control" min="1"
                       value="{{ trek.duration if trek else '' }}" required>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Total Slots <span class="text-danger">*</span></label>
                <input type="number" name="total_slots" class="form-control" min="1"
                       value="{{ trek.total_slots if trek else '' }}" required>
            </div>
        </div>
        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label">Status</label>
                <select name="status" class="form-select">
                    {% for s in ['Pending', 'Open', 'Closed', 'Completed'] %}
                        <option value="{{ s }}" {% if trek and trek.status == s %}selected{% endif %}>{{ s }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Start Date</label>
                <input type="date" name="start_date" class="form-control"
                       value="{{ trek.start_date.strftime('%Y-%m-%d') if trek and trek.start_date else '' }}">
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">End Date</label>
                <input type="date" name="end_date" class="form-control"
                       value="{{ trek.end_date.strftime('%Y-%m-%d') if trek and trek.end_date else '' }}">
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control" rows="3">{{ trek.description if trek else '' }}</textarea>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-success">{% if trek %}Update Trek{% else %}Create Trek{% endif %}</button>
            <a href="{{ url_for('main.admin_treks') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
</div>
</div>
{% endblock %}
